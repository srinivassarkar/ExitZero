<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExitZero - Offline</title>
  <style>
    body {
      background-color: #111827;
      color: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      color: #22c55e;
      font-size: 2rem;
      margin-bottom: 20px;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    button {
      background-color: transparent;
      color: #22c55e;
      border: 1px solid #22c55e;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    button:hover {
      background-color: #22c55e;
      color: #111827;
    }
  </style>
</head>
<body>
  <h1>$ exit 0</h1>
  <p>You're offline. Your cached questions are still available.</p>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
